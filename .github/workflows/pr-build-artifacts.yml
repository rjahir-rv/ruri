name: Build PR Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  NODE_VERSION: "24.x"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  check-permissions:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    name: Check if user has write access
    runs-on: ubuntu-latest
    outputs:
      has-write-access: ${{ steps.check.outputs.require-result }}
    steps:
      - name: Check user permission
        id: check
        uses: actions-cool/check-user-permission@7b90a27f92f3961b368376107661682c441f6103
        with:
          require: write
          username: ${{ github.event.pull_request.user.login }}

  build:
    name: Build ${{ matrix.os }}
    needs: check-permissions
    if: needs.check-permissions.outputs.has-write-access == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vite build
        run: pnpm build

      - name: Package Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: pnpm exec electron-builder --linux AppImage:x64 tar.gz:x64 -p never

      - name: Package Windows
        if: startsWith(matrix.os, 'windows')
        run: pnpm exec electron-builder --win portable:x64 nsis:x64 -p never

      - name: Package macOS
        if: startsWith(matrix.os, 'macOS')
        run: pnpm exec electron-builder --mac dmg:x64 dmg:arm64 -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: build-artifacts-${{ matrix.os }}
          path: pack/
          retention-days: 7
          if-no-files-found: error

  comment:
    name: Comment on PR
    needs: [check-permissions, build]
    if: always() && needs.check-permissions.outputs.has-write-access == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const buildResult = '${{ needs.build.result }}';

            let comment;
            if (buildResult === 'success') {
              comment = `## Build artifacts ready

            Download from the workflow run: [artifacts](${runUrl})

            - Windows: \`build-artifacts-windows-latest\`
            - macOS: \`build-artifacts-macos-latest\`
            - Linux: \`build-artifacts-ubuntu-latest\` (AppImage + tar.gz)

            Artifacts expire in 7 days.`;
            } else if (buildResult === 'failure') {
              comment = `## Build failed

            One or more platform jobs failed. [Workflow run](${runUrl})`;
            } else {
              comment = `## Build status: ${buildResult}

            [Workflow run](${runUrl})`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });
