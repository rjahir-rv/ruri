name: Build Ruri

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

env:
  NODE_VERSION: "24.x"

# Compile only. Do not run Pear's release/publish jobs.
# Signed releases are a later phase (see AGENTS.md Fase 6).

jobs:
  build:
    name: Build Ruri
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Vite build
        run: pnpm build
