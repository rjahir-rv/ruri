# Dependency Review Action
#
# Needs Settings → Code security → Dependency graph. Until that is on, the
# action fails every PR with "Dependency review is not supported on this
# repository." Run it by hand after enabling the graph, then restore
# `on: pull_request` if you want it as a required check.
#
# Source: https://github.com/actions/dependency-review-action
name: "Dependency Review"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: "Dependency Review"
        uses: actions/dependency-review-action@f5b971718edcbb31275a1db40004592335c0e031
