<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ruri: lapis-glass pebble. Not a play button, not a pear. -->
  <defs>
    <linearGradient id="ruri-bg" x1="180" y1="80" x2="860" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2744"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="ruri-stone" x1="280" y1="180" x2="780" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7EC8E3"/>
      <stop offset="0.38" stop-color="#3D7EA6"/>
      <stop offset="1" stop-color="#1B3B6F"/>
    </linearGradient>
    <radialGradient id="ruri-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 360) rotate(90) scale(420 380)">
      <stop stop-color="white" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="white" stop-opacity="0.04"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ruri-rim" x1="512" y1="140" x2="512" y2="884" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="white" stop-opacity="0.08"/>
      <stop offset="1" stop-color="white" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="ruri-soft" x="80" y="80" width="864" height="864" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#ruri-bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="220" stroke="url(#ruri-rim)" stroke-width="10"/>

  <ellipse cx="400" cy="300" rx="260" ry="160" fill="#9FD6EC" opacity="0.18" filter="url(#ruri-soft)"/>

  <circle cx="512" cy="520" r="318" fill="url(#ruri-stone)"/>
  <circle cx="512" cy="520" r="318" fill="url(#ruri-glow)"/>
  <circle cx="512" cy="520" r="310" stroke="white" stroke-opacity="0.22" stroke-width="8"/>

  <path d="M330 390 C380 300, 520 270, 610 330 C520 320, 430 360, 330 390Z" fill="white" fill-opacity="0.28"/>
  <path d="M700 620 C740 700, 680 780, 560 800 C680 740, 720 680, 700 620Z" fill="#04101F" fill-opacity="0.18"/>
</svg>
